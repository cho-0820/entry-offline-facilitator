name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      USE_HARD_LINKS: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup MSVC developer command prompt (Windows)
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Python 3.11 (for node-gyp)
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'yarn'
          cache-dependency-path: yarn.lock

      - name: Install dependencies (ignore-scripts)
        run: yarn install --ignore-scripts

      - name: Rebuild native dependencies (electron-rebuild)
        run: yarn rebuild

      - name: Build Webpack assets
        run: yarn webpack:prod

      - name: Build and Publish Electron Package
        run: npx electron-builder -c --publish always
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
